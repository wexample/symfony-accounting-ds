      label: Subject to VAT
    vatPeriodicity:
      label: VAT returns
      choice:
        monthly:
          label: Monthly
        quarterly:
          label: Quarterly
        annual:
          label: Annual
        none:
          label: None
    vatOnPayments:
      label: VAT due on payments
    invoicePrefix:
      label: Document number prefix
    paymentTermDays:
      label: Payment term (days)
    legalMentions:
      label: Legal mentions printed on documents
  action:
    submit: Save
